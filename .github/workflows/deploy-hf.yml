"""Redeploy the Hugging Face Space automatically on every push to main.

Required repo secrets:
  HF_TOKEN           — Hugging Face token with write scope
  HF_DEPLOY_ENABLED  — set to "true" to activate (HF Docker Spaces need PRO;
                       flip this on after subscribing, off to pause deploys)

Add with the gh CLI:
  gh secret set HF_TOKEN -R sanzizlohar/voice-cloning-system
  gh variable set HF_DEPLOY_ENABLED -R sanzizlohar/voice-cloning-system --body "true"
"""

name: deploy-hf-space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - run: python scripts/deploy_hf.py --token "${{ secrets.HF_TOKEN }}"
